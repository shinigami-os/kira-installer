set timeout=3
set default=0

menuentry "Kira Linux Installer" {
    insmod search
    insmod search_label
    insmod iso9660
    search --no-floppy --label --set=root KIRA
    linux /boot/bzImage root=live console=tty1 console=ttyS0
    initrd /boot/initramfs.cpio.gz
}
menuentry 'Reboot Computer' {
    reboot
}
menuentry 'Shutdown Computer' {
    halt
}